[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-cli"
version = "1.0.2"
description = "Consumer governance CLI for CORE — pure HTTP client for governing repositories against CORE constitutional rules."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    { name = "Dariusz Newecki", email = "d.newecki@gmail.com" },
]
keywords = ["governance", "cli", "code-quality", "constitutional-ai", "developer-tools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "core-runtime>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
core = "core_cli.main:app"

[project.urls]
Homepage = "https://github.com/DariuszNewecki/CORE"
Repository = "https://github.com/DariuszNewecki/core-cli"
"Bug Tracker" = "https://github.com/DariuszNewecki/core-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/core_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# B008: typer.Option / typer.Argument as parameter defaults is Typer's
# documented idiom, not a bug (CORE ignores it for the same reason).
ignore = ["B008"]

[tool.ruff.lint.isort]
# Match the layout the code was written in (CORE's settings): core-runtime's
# packages group with core_cli, two blank lines after imports.
known-first-party = ["api", "body", "cli", "core_cli", "mind", "shared", "will"]
lines-after-imports = 2
