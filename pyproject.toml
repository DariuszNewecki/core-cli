[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-cli"
version = "1.0.0"
description = "Consumer governance CLI for CORE — pure HTTP client for governing repositories against CORE rules."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Dariusz Newecki", email = "d.newecki@gmail.com" },
]
dependencies = [
    "core-runtime>=2.8.0",
]

[project.scripts]
core = "core_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/core_cli"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
