name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src/

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy + stubs
        run: pip install mypy types-PyYAML

      - name: mypy
        # Ignore missing imports: core-runtime not on PyPI yet (Phase E).
        # Re-enable strict mode once the wheel is published.
        run: mypy src/ --ignore-missing-imports --no-error-summary

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core-runtime from source + dev deps
        # core-runtime is not yet on PyPI (Phase E). Install from the monorepo
        # via a local path checkout. In the interim CI skips if CORE_SRC is unset.
        run: |
          pip install pytest pytest-asyncio
          if [ -n "$CORE_SRC" ]; then
            pip install -e "$CORE_SRC"
          else
            echo "CORE_SRC not set — skipping runtime install; tests will be skipped."
            echo "SKIP_TESTS=1" >> "$GITHUB_ENV"
          fi

      - name: Run tests
        if: env.SKIP_TESTS != '1'
        run: pytest tests/ -v
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: src

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install hatchling
          python -m hatchling build

      - name: Publish to PyPI (Trusted Publisher OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
