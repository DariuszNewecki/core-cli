name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned: an unpinned ruff picked up new default rules and turned lint
        # red on unchanged code (2026-10). Bump deliberately.
        run: pip install ruff==0.16.10

      - name: ruff check
        run: ruff check src/

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy + stubs
        run: pip install mypy types-PyYAML

      - name: Install package
        run: pip install -e .

      - name: mypy
        run: mypy src/ --no-error-summary

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        # tests/test_contract.py reads CORE's OpenAPI contract from CORE's main
        # branch on GitHub (no CORE checkout here).
        run: pytest tests/ -v

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    # Only publish on version tags; all checks must pass first.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    # "pypi" environment must be configured in GitHub repo Settings → Environments.
    # The matching Trusted Publisher must be registered at pypi.org/manage/account/publishing/
    # with: project=core-cli, owner=DariuszNewecki, repo=core-cli, workflow=ci.yml, env=pypi.
    environment: pypi
    permissions:
      id-token: write  # required for OIDC Trusted Publisher token exchange
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publisher OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
