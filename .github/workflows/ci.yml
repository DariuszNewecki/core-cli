name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src/

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy + stubs
        run: pip install mypy types-PyYAML

      - name: mypy
        # Ignore missing imports: core-runtime not on PyPI yet (Phase E).
        # Re-enable strict mode once the wheel is published.
        run: mypy src/ --ignore-missing-imports --no-error-summary

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core-runtime from source + dev deps
        # core-runtime is not yet on PyPI (Phase E). Install from the monorepo
        # via a local path checkout. In the interim CI skips if CORE_SRC is unset.
        run: |
          pip install pytest pytest-asyncio
          if [ -n "$CORE_SRC" ]; then
            pip install -e "$CORE_SRC"
          else
            echo "CORE_SRC not set — skipping runtime install; tests will be skipped."
            echo "SKIP_TESTS=1" >> "$GITHUB_ENV"
          fi

      - name: Run tests
        if: env.SKIP_TESTS != '1'
        run: pytest tests/ -v
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: src

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    # Only publish on version tags; all checks must pass first.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    # "pypi" environment must be configured in GitHub repo Settings → Environments.
    # The matching Trusted Publisher must be registered at pypi.org/manage/account/publishing/
    # with: project=core-cli, owner=DariuszNewecki, repo=core-cli, workflow=ci.yml, env=pypi.
    environment: pypi
    permissions:
      id-token: write  # required for OIDC Trusted Publisher token exchange
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publisher OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
